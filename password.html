<!DOCTYPE html>
<html lang="en-in">
    <head>
        <link rel="stylesheet" href="password.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
        <title>Storng and Secure Password generator</title>

    </head>
    <body>
        <div class="container">

            
            <div class="head">
                <h2 class>Password generator</h2>
                <div class="intro">
                    <div class="intro1">
                    <img src="../../assets/secure password.webp">

                </div>
                <div class="intro2">
                     <div>
                    <label class="text-white">Enter your name</label>
                    <input type="text" class="form-control" name="txtPassowrd" placeholder="enter your name" id="userName">
                    <label class="text-white">Enter password length</label>
                    <input type="number" class="form-control" name="txtNumber" id="length" placeholder="length of password between 4 to 20" min="4" max="20">
                    <label class="text-white mt-2">
                        <input type="checkbox" id="lowercase">lower case(a-z) 
                    </label>
                    <br>
                    <label class="text-white">
                        <input type="checkbox" id="uppercase">upper case(A-z) 
                    </label>
                    <br>
                    <label class="text-white mt-2">
                        <input type="checkbox" id="num">numbers between(0 to 9) 
                    </label>
                    <br>
                    <label class="text-white mt-2">
                        <input type="checkbox" id="special">Special characters (@#$&)
                    </label><br><br><br>
                    <button type="button" id="myBtn">Generate password</button> <br><br>
                    <p id="newpassword" class="text-white mt-3"></p>
                </div>

                </div>
                

                
               
            
            </div>
        </div>
        <script src="password.js"></script>

    </body>
</html>
